<script>(function () {
  // HERON live logo: the light follows the pointer, the arm reaches for it (spring-driven joints), the camera head
  // looks around, follows the pointer and takes a picture on click. The percent-sign placeholders are filled by
  // final_build.py.
  var svg = document.getElementById("heronSvg");
  var stage = document.getElementById("heronStage");
  if (!svg || !stage) return;
  var ld = document.getElementById("ldS"), ls = document.getElementById("lsS");
  var dif = ld.parentNode, spe = ls.parentNode;
  var off = document.getElementById("soffS"), offc = document.getElementById("soffcS");
  var head = document.getElementById("camHeadS"), flash = document.getElementById("flashS");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MINX = -20, MAXX = 717, MINY = -145.7, MAXY = 125, CXL = 348.5, CYL = -2.85, PX = 148.67, PY = -74.74;
  // the arm at rest (logo units): shoulder S on top of the H, elbow E, wrist W; the camera pivot (PX, PY) is on the post
  var SX = 106.25, SY = 6, EX = 95.85, EY = -42.91, WX = 148.67, WY = -54.13, SWING = 35;
  var tx = -30, ty = -125.7, cx = tx, cy = ty, last = -1e9, raf = 0, visible = true, lastIdle = 0, lastT = -1;
  var pvx = 0, pvy = 0, over = false, wake = 0, firstStep = true;
  // the opening: the arm waits folded (for the 3D head, at most until armLatest), gathers, rises, then the camera
  // looks around and takes the first picture
  var DUR = 1400, armStart = reduce ? -1 : performance.now() + 500, armLatest = armStart + 1500;
  var introStart = armStart + DUR + 200, introDone = reduce, flashStart = -1e9, flashedIntro = reduce;
  var pan = 0, tilt = 0, panT = 0, tiltT = 0, headBusy = false;
  // the WebGL camera head (heron-cam3d.js) once it is ready; until then, or without WebGL, the SVG head is drawn
  var cam3d = null, cam3dWait = !reduce;
  document.addEventListener("heron-cam3d", function (e) {
    if (!e.detail || e.detail.svg !== svg) return;
    cam3dWait = false;
    if (!e.detail.failed) { cam3d = e.detail; apply(0); }
    kick();
  });
  function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, k) { return a + (b - a) * ease(clamp(k, 0, 1)); }
  // smoothing per second, not per frame, so 60, 120 and 144 Hz screens all look the same
  function smooth(dt, tau) { return 1 - Math.exp(-dt / tau); }

  // Angles are degrees in the SVG sense (clockwise on screen is positive), relative to the rest pose. Each target
  // eases in over tau (no instant jolt) and the spring lands with one soft overshoot (z about 0.7). The elbow is
  // stiffer than the shoulder, so the forearm leads and the upper arm follows. The wrist is a levelling servo (it
  // tracks the arm's own velocity) and the gimbal keeps the camera level (tiltW), so the head never bobs on its post.

  };

  function springTo(j, target, dt, tv) {

// the viewfinder hump: a rounded block that narrows toward the top (like the trapezoid in the drawing)

function brushTexture() {

  // no tint) and a separate roughness map with a little more swing

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < H; y++) {
    const row = 0.55 + 0.45 * rnd(), ph = rnd() * 6.28;

      const v = Math.max(0, Math.min(1, row + 0.08 * Math.sin(x / W * 6.283 * 2 + ph) + 0.06 * (rnd() - 0.5)));
      const o = (y * W + x) * 4, b = 236 + Math.round(19 * v), g = 200 + Math.round(55 * v);

}

/* ---------- studio environment the metal reflects ---------- */
function studio(renderer) {
  const scene = new THREE.Scene();
  const lin = (hex, k = 1) => new THREE.Color(hex).multiplyScalar(k);
  // sky light above, a mid-grey horizon, darker floor: the same top-light / dark-band / lighter-floor rhythm
  // as the letters' brushed gradient (#F4F6F8 / #A9B1B9 / #C0C6CC); dimmer behind the camera
  const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { cTop: { value: lin("#F4F6F8", 0.95) }, cHor: { value: lin("#A9B1B9", 0.85) }, cLow: { value: lin("#7E868E", 0.8) }, cBot: { value: lin("#C0C6CC", 0.7) } },
    vertexShader: "varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: `uniform vec3 cTop, cHor, cLow, cBot; varying vec3 vD;

        vec3 c = e > 0.0 ? mix(cHor, cTop, smoothstep(0.0, 0.6, e)) : mix(mix(cHor, cLow, smoothstep(0.0, -0.3, e)), cBot, smoothstep(-0.45, -0.95, e));

  scene.add(sky);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: lin("#FFFFFF", k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); scene.add(m);

  panel(14, 60, 1.1, -72, 18, 22);    // narrow strip on the left: a clean vertical edge highlight
  panel(44, 14, 0.7, 34, 44, -58);    // rim from behind, upper right
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(scene, 0.035);
  pm.dispose();

}

/* ---------- soft highlight shoulder ---------- */

    wrap.style.visibility = "visible";
    if (opt.static) { hideSvgHead(); return; }
    // fade the 3D head in over the vector head (same pose), then hide the vector one: no visible swap
    wrap.style.opacity = "0";
    wrap.style.transition = "opacity 160ms ease-out";
    void wrap.offsetWidth;                         // commit the start value so the transition runs
    wrap.style.opacity = "1";
    setTimeout(hideSvgHead, 200);
  }
  function deactivate() {
    alive = false; on = false;
    if (flash && flashHome) { flash.removeAttribute("transform"); flashHome.insertBefore(flash, flashNext); }
    head.style.visibility = "";
    if (motorEl) motorEl.style.visibility = "";
    wrap.remove();
  }
  R3.lost(function (e) { e.preventDefault(); deactivate(); });

  const api = {
    svg, sfx, stats: st, force: null,     // force = [pan, tilt] pins the pose (tests only)
    ok() { return alive; },
    last() { return lastArgs; },
    // called by the page script on every animation step; returns false if the 3D head is gone
    frame(pan, tilt, lx, ly, fo, sdx, sdy) {
      if (!alive) return false;
      lastArgs = [pan, tilt, lx, ly, fo, sdx, sdy];
      if (api.force) { pan = api.force[0]; tilt = api.force[1]; }
      const G = layout();
      if (!G) return true;
      L = G;
      const ox = lx - G.pu.x, oy = ly - G.pu.y;
      const key = [pan.toFixed(4), tilt.toFixed(3), G.roll.toFixed(4), ox.toFixed(1), oy.toFixed(1), fo.toFixed(3), G.left, G.top, G.Wd, G.Hd, G.px0.toFixed(2), G.py0.toFixed(2), G.ss].join("|");
      if (key !== last) {
        last = key;
        const ts = performance.now();
        place(G);
        R3.draw(pan, tilt, ox, oy, fo, G.roll);
        const ms = performance.now() - ts;
        st.renders++; st.ms += ms; st.maxMs = Math.max(st.maxMs, ms);
        if (flash) {
          const q = R3.project(pan, tilt, LENS_TIP, G.roll);
          flash.setAttribute("transform", "translate(" + (q[0] - FCX).toFixed(2) + " " + (q[1] - FCY).toFixed(2) + ")");
        }
        if (!on) activate();
      } else st.skipped++;
      const sh = "drop-shadow(" + (sdx * G.scale).toFixed(1) + "px " + (sdy * G.scale).toFixed(1) + "px " + (2.8 * G.scale).toFixed(1) + "px rgba(0,0,0,0.92))";
      if (sh !== lastShadow) { lastShadow = sh; cv.style.filter = sh; }
      return true;
    },
    // lens front in logo units, for the flash light
    lens(pan, tilt) {
      if (api.force) { pan = api.force[0]; tilt = api.force[1]; }
      const G = layout() || L;                       // fresh: the arm may have moved since the last frame
      const q = R3.project(pan, tilt, LENS_TIP, G ? G.roll : 0);
      return G ? [G.pu.x + q[0], G.pu.y + q[1]] : [PX + q[0], PY + q[1]];
    },
  };
  // size the canvas and draw once while it is still hidden, so buffers and textures exist before it shows
  const G0 = layout();
  if (G0) { place(G0); R3.draw(0, 0, -150, -50, 0, G0.roll); }
  st.initMs = Math.round(performance.now() - t0);
  window.HeronCam3D = window.HeronCam3D || {};
  window.HeronCam3D[sfx] = api;
  if (opt.static) {
    // export page without the live script: neutral pose, light and shadow as written in the markup
    const ld = document.getElementById("ld" + sfx), so = document.getElementById("soffc" + sfx);
    const draw = () => api.frame(0, 0, +ld.getAttribute("x"), +ld.getAttribute("y"), 0, +so.getAttribute("dx"), +so.getAttribute("dy"));
    draw();
    window.addEventListener("resize", draw);
    document.documentElement.setAttribute("data-cam3d", "ready");
  } else {
    // the stage can change size without a window resize (fonts, container queries): redraw at the new place
    if ("ResizeObserver" in window) new ResizeObserver(function () { if (lastArgs) { last = ""; api.frame.apply(null, lastArgs); } }).observe(stage);
    document.dispatchEvent(new CustomEvent("heron-cam3d", { detail: api }));
  }
  return api;
}

attach("heronSvg", "heronStage", "S");
</script>
</body></html>
